<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Corp - AI Support</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-brand">
        <div class="avatar">AI</div>
        <div class="header-info">
          <h1>Support Agent</h1>
          <div class="status">
            <div id="status-dot" class="status-dot"></div>
            <span id="status-text">Online</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Chat Log -->
    <div id="chat-log" class="chat-log">
      <!-- Chat bubbles will be injected here -->
      <div class="bubble-container ai">
        <div class="bubble">Hi! How can I help you today?</div>
        <div class="timestamp">Just now</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="start" class="call-btn" disabled>
        <svg class="mic-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
        </svg>
        <span id="btn-text">Connecting...</span>
      </button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
