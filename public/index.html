<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Calling Backend - Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>AI Calling Simulator</h1>
      <div class="status">
        <div id="status-dot" class="status-dot"></div>
        <span id="status-text">Ready</span>
      </div>
    </div>

    <!-- Visualizer / Orb -->
    <div class="orb-container">
      <div id="orb" class="orb"></div>
    </div>

    <!-- Chat Log -->
    <div id="chat-log" class="chat-log">
      <!-- Chat bubbles will be injected here -->
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="start" class="call-btn" disabled>
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
        Connecting...
      </button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
